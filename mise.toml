[tools]
bun = "latest"
dotnet = "latest"
java = "latest"
node = "latest"

[tasks.server-test]
run = "dotnet test -c Release"

[tasks.server-test-coverage]
run = [
  'dotnet test -c Release --collect:"XPlat Code Coverage" --results-directory ./TestResults',
  'dotnet reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage" "-reporttypes:Html;lcov;Cobertura;TextSummary"',
]

[tasks.web-install]
dir = "web"
run = ["bun install", "bunx playwright install --with-deps"]

[tasks.web-test]
depends = ["web-install"]
dir = "web"
run = "bun run test"

[tasks.web-test-coverage]
depends = ["web-install"]
dir = "web"
run = "bun run test:coverage"
