name: main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  SERVER_IMAGE_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_SERVER_SERVICE }}:${{ github.sha }}
  WEB_IMAGE_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_WEB_SERVICE }}:${{ github.sha }}

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4

      - name: Run Server Tests
        run: mise run server-test

  build-server:
    runs-on: ubuntu-latest
    needs: [ server-tests ]
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      id-token: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Login to Google Cloud Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$ACCESS_TOKEN" | podman login \
              -u oauth2accesstoken \
              --password-stdin \
              ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push server image
        run: |
          podman build -t ${{ env.SERVER_IMAGE_TAG }} --format docker -f ./DocumentProcessingPipeline.Server/Dockerfile .
          podman push ${{ env.SERVER_IMAGE_TAG }}

  build-web:
    runs-on: ubuntu-latest
    needs: [ server-tests ]
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      id-token: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Login to Google Cloud Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$ACCESS_TOKEN" | podman login \
              -u oauth2accesstoken \
              --password-stdin \
              ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push web image
        run: |
          podman build --format docker -t ${{ env.WEB_IMAGE_TAG }} -f ./frontend/Dockerfile .
          podman push ${{ env.WEB_IMAGE_TAG }}

  deploy-server:
    runs-on: ubuntu-latest
    needs: [ build-server ]
    if: github.ref == 'refs/heads/main'
    
    permissions:
      id-token: write
      
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Deploy ${{ vars.GCP_SERVER_SERVICE }} to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_SERVER_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.SERVER_IMAGE_TAG }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: [ build-web ]
    if: github.ref == 'refs/heads/main'
    
    permissions:
      id-token: write
      
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Deploy ${{ vars.GCP_WEB_SERVICE }} to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_WEB_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.WEB_IMAGE_TAG }}